name: Acquire original SignalDesk sources
on:
  workflow_dispatch:
  push:
    paths:
      - data/seed-events.json
      - tools/acquire.py
      - tools/build_corpus.py
      - .github/workflows/acquire.yml
permissions:
  contents: write
jobs:
  acquire:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -e '.[test]'
      - name: Acquire original publisher bytes
        id: acquisition
        continue-on-error: true
        run: python tools/acquire.py
      - name: Build corpus with explicit provenance
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
        run: |
          if [ "$ACQUISITION_OUTCOME" = 'success' ]; then
            python tools/build_corpus.py
          else
            python tools/build_corpus.py --seed-only
          fi
      - run: python -m pytest -q tests/python
        env:
          SIGNALDESK_REQUIRE_RAW: '1'
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: node tools/check-freeze.mjs
      - name: Retain original bytes and acquisition receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signaldesk-original-source-evidence
          path: |
            data/raw/
            data/source-manifest.json
            data/corpus.json
            reports/source-validation.json
            reports/data-quality.json
      - name: Commit verified derived corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus.json data/source-manifest.json reports/source-validation.json reports/data-quality.json
          git diff --cached --quiet || git commit -m 'Update source acquisition receipts and labelled evidence corpus'
          git push
