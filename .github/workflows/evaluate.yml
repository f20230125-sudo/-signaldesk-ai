name: Run opt-in SignalDesk evaluation
on:
  workflow_dispatch:
    inputs:
      split:
        description: Evaluation split
        type: choice
        options: [development, held-out]
        default: development
      allow_seed:
        description: Allow clearly labelled browser-reviewed summaries for development only
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: signaldesk-real-model-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check model availability and key access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: node --experimental-strip-types tools/check-model.ts
      - name: Real model run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          SIGNALDESK_LIVE_EVAL: '1'
          EVALUATION_SPLIT: ${{ inputs.split || 'development' }}
          ALLOW_SEED: ${{ inputs.allow_seed }}
        run: |
          if [ "$EVALUATION_SPLIT" = 'development' ]; then
            if [ "$ALLOW_SEED" = 'true' ]; then
              node --experimental-strip-types tools/evaluate.ts --dev --allow-seed
            else
              node --experimental-strip-types tools/evaluate.ts --dev
            fi
          else
            node --experimental-strip-types tools/evaluate.ts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signaldesk-real-model-evaluation
          path: |
            reports/runs/
            reports/development-evaluation.json
            reports/model-access.json
            data/evaluation/report.json
      - name: Save public evaluation results
        if: always()
        run: |
          if [ -f reports/development-evaluation.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/development-evaluation.json
            git add data/evaluation/report.json
            if [ -f reports/model-access.json ]; then git add reports/model-access.json; fi
            git diff --cached --quiet || git commit -m 'Record real-model evaluation responses awaiting semantic review'
            git pull --rebase origin main
            git push
          fi
