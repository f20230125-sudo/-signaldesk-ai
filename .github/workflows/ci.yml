name: Verify SignalDesk
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: python -m pytest -q tests/python
      - run: node tools/check-freeze.mjs
      - run: node tools/check-source.mjs
      - run: npm run db:generate
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: signaldesk-web-build
          path: |
            dist/
            .openai/hosting.json
            drizzle/
            reports/
