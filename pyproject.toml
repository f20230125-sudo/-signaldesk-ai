[project]
name = "signaldesk-pipeline"
version = "0.1.0"
description = "Reproducible FDA oncology event and supporting trial evidence pipeline"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "duckdb>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = []
